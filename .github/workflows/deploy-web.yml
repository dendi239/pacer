name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "pacer/**"
      - "tracks/**"
      - "landing/**"
      - "scripts/assemble-site.sh"
      - "scripts/check-site-links.py"
      - "3rdparty/**"
      - "CMakeLists.txt"
      - ".github/workflows/deploy-web.yml"
  # So the site can be rebuilt without a code change, e.g. to pick up an
  # edited track file.
  workflow_dispatch:

# One deployment at a time, and let a newer push finish rather than
# cancelling it mid-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hello_imgui, imgui, implot and friends are submodules; without
          # them the configure step has nothing to build.
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned to the version the web build was developed against; bump
          # deliberately rather than letting CI drift onto a new toolchain.
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        # The key ends up in the public page, so it must be restricted to
        # this site's referrer and to the Map Tiles API in Google Cloud.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}
        run: >
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPACER_GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Build
        run: cmake --build build-web --target track_annotator

      - name: Assemble site and check its links
        # index.html is the landing page; the annotator stays at
        # track_annotator.html and the timeline page at timeline.html. The
        # script fails the build if any page links to a file that is not in
        # the site, or a landing-page track variant is missing its data.
        run: |
          scripts/assemble-site.sh site --require-annotator
          ls -lh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
