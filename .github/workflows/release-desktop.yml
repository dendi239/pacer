name: Release desktop apps

on:
  # Pushing a tag like v0.2.0 builds both apps and attaches them to a GitHub
  # Release of that name.
  push:
    tags: ["v*"]
  # Builds without releasing; the zipped apps are left as workflow artifacts,
  # handy for checking a build before tagging it.
  workflow_dispatch:

jobs:
  macos:
    # Apple silicon, the only platform the pixi env targets.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # hello_imgui, imgui, implot, gpmf-parser and friends are submodules.
          submodules: recursive

      - name: Install dependencies
        # Python and Catch2 are only needed to get through the top-level
        # configure; neither app links them. dylibbundler copies the brew
        # dylibs (glfw, freetype, libpng) into the bundles so they run on a
        # machine without Homebrew.
        run: brew install ninja glfw catch2 nlohmann-json freetype dylibbundler

      - name: Configure
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-release --target timeline track_annotator

      - name: Bundle and package
        run: |
          mkdir -p dist
          for app in timeline track_annotator; do
            bundle=build-release/apps/$app.app
            dylibbundler -od -b \
              -x "$bundle/Contents/MacOS/$app" \
              -d "$bundle/Contents/Frameworks" \
              -p @executable_path/../Frameworks/ \
              -s "$(brew --prefix)/lib"
            # Rewriting install names breaks the linker's ad-hoc signature,
            # and arm64 refuses to run unsigned code, so sign again.
            codesign --force --deep --sign - "$bundle"
            otool -L "$bundle/Contents/MacOS/$app"
            # ditto, not zip: it keeps the bundle's symlinks and metadata.
            ditto -c -k --keepParent "$bundle" "dist/$app-macos-arm64.zip"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pacer-macos-arm64
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned builds for Apple silicon. macOS quarantines apps downloaded from the web; after unzipping, run \`xattr -dr com.apple.quarantine timeline.app track_annotator.app\` (or right-click → Open) before the first launch."
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
